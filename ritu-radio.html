<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142f3d"><title>Ritu Radio — Radio Gali</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Yatra+One&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box} :root{--sky:#142f3d;--glow:#a9e3ee;--ground:#203c37;--text:#fff7e9}body{margin:0;background:var(--sky);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;transition:background 1s,color .6s}#world{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:linear-gradient(var(--sky),#493e46 57%,var(--ground));transition:background 1s}#world:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#ffffff14,transparent 55%);animation:skybreath 9s ease-in-out infinite alternate}.cloud{position:absolute;width:38vw;height:8vw;min-height:45px;background:#ffffff0d;filter:blur(18px);border-radius:50%;animation:cloud 28s linear infinite}.cloud:nth-child(2){top:20%;left:-40%;animation-duration:40s}.cloud:nth-child(3){top:34%;left:-50%;animation-duration:52s;animation-delay:-19s}.horizon{position:absolute;bottom:15%;left:-5%;width:110%;height:25%;background:linear-gradient(165deg,transparent 0 25%,#182d2a 26% 50%,#0e201f 51%);clip-path:polygon(0 40%,12% 18%,22% 40%,36% 8%,49% 38%,63% 17%,79% 42%,92% 12%,100% 35%,100% 100%,0 100%);opacity:.8}.ground{position:absolute;bottom:0;height:17%;width:100%;background:linear-gradient(#192d2b,#101c1c)}#weather{position:absolute;inset:0;width:100%;height:100%;opacity:.85}main{position:relative;z-index:2;max-width:1250px;margin:auto;padding:22px 30px 40px;min-height:100vh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#ffc84a;color:#271b10;font-size:24px}.tiny{font-size:10px;letter-spacing:3px;opacity:.7}.clock{font-weight:800;font-size:clamp(17px,2vw,27px);font-variant-numeric:tabular-nums}.hero{text-align:center;margin:auto auto 20px;max-width:760px;padding:30px 0 0}.eyebrow{letter-spacing:5px;font-size:11px;font-weight:800;opacity:.8}.hero h1{font:clamp(54px,9vw,112px)/.96 'Yatra One',serif;margin:14px 0 10px;text-shadow:0 8px 35px #0004}.subtitle{letter-spacing:4px;font-size:11px;font-weight:800;opacity:.75}.scene{height:clamp(150px,27vh,300px);position:relative;margin:10px auto 20px;width:min(760px,100%);display:grid;place-items:center}.sun{position:absolute;width:clamp(90px,12vw,160px);aspect-ratio:1;border-radius:50%;background:#ffd68a;box-shadow:0 0 80px 25px #ffd68a44;top:10%;left:calc(50% - 60px);transition:all 1s}.moon{display:none;position:absolute;width:105px;height:105px;border-radius:50%;background:#e4edf7;box-shadow:0 0 60px #d8e7ff55;top:10%;left:calc(50% - 60px)}.landscape{position:absolute;bottom:0;width:100%;height:60%;background:linear-gradient(160deg,#6b7855,#263f37 65%);clip-path:polygon(0 65%,12% 35%,22% 58%,37% 12%,51% 55%,69% 22%,84% 50%,100% 28%,100% 100%,0 100%);filter:drop-shadow(0 10px 15px #0004)}.hut{position:absolute;bottom:5%;left:calc(50% - 65px);font-size:clamp(65px,9vw,100px);filter:drop-shadow(0 14px 15px #0006);animation:hutfloat 5s ease-in-out infinite}.season-picker{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:0 auto 22px}.season{border:1px solid #ffffff3a;background:#08141b65;color:white;padding:12px 17px;border-radius:999px;cursor:pointer;backdrop-filter:blur(14px);font-weight:700;transition:transform .35s,background .5s,box-shadow .5s}.season:hover{transform:translateY(-3px)}.season[aria-pressed=true]{background:#ffffffdc;color:#1a2024;box-shadow:0 8px 35px #0003}.player{width:min(720px,100%);margin:0 auto;background:#170f0bc2;border:1px solid #ffffff20;border-radius:28px;padding:18px 22px;display:flex;align-items:center;gap:18px;backdrop-filter:blur(22px);box-shadow:0 18px 60px #0004}.cover{width:70px;height:70px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:35px;background:linear-gradient(135deg,#ffdc9c,#b97438)}.track{flex:1;min-width:0}.track b{display:block;font-size:16px}.track small{opacity:.7}.controls{display:flex;gap:9px;align-items:center}.controls button{border:0;cursor:pointer;border-radius:50%;width:42px;height:42px;background:#ffffff15;color:white;font-size:16px}.controls .play{width:58px;height:58px;background:white;color:#25180f;font-size:23px}.hint{text-align:center;font-size:10px;letter-spacing:2px;opacity:.65;margin-top:18px}.rain-drop{position:absolute;top:-30px;width:1px;height:25px;background:#c5eaff88;animation:rainfall linear infinite}.snow{position:absolute;top:-10px;width:5px;height:5px;background:#fff;border-radius:50%;filter:drop-shadow(0 0 5px #fff);animation:snowfall linear infinite}.heat{position:absolute;bottom:0;height:70%;width:50%;left:25%;background:linear-gradient(transparent,#ffb13b12);filter:blur(30px);animation:heat 3s ease-in-out infinite alternate}.leaf{position:absolute;top:-20px;font-size:19px;animation:fall linear infinite}@keyframes cloud{from{transform:translateX(0)}to{transform:translateX(160vw)}}@keyframes skybreath{to{opacity:.35;transform:scale(1.08)}}@keyframes hutfloat{50%{transform:translateY(-5px)}}@keyframes rainfall{to{transform:translate(40px,110vh)}}@keyframes snowfall{to{transform:translate(100px,110vh) rotate(360deg)}}@keyframes fall{to{transform:translate(80px,110vh) rotate(300deg)}}@keyframes heat{to{opacity:.3;transform:scale(1.15)}}@media(max-width:600px){main{padding:16px 14px 28px}.top .tiny{letter-spacing:1.5px}.player{padding:14px;gap:10px;border-radius:22px}.cover{width:52px;height:52px;font-size:25px}.track b{font-size:13px}.track small{font-size:11px}.controls{gap:4px}.controls button{width:34px;height:34px}.controls .play{width:46px;height:46px}.season{padding:10px 12px;font-size:12px}.hero{padding-top:25px}.eyebrow{letter-spacing:3px}}

html{background:var(--bg,var(--paper,#111))}body{position:relative;isolation:isolate}body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(180deg,rgba(10,8,20,.68),rgba(10,8,20,.80)),url("https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=2200&q=85");background-size:cover;background-position:center;background-attachment:fixed;opacity:.48}body.night:after{opacity:.32}@media(max-width:760px){body:after{background-attachment:scroll;background-position:center;background-size:cover;opacity:.34}}@media(prefers-reduced-motion:reduce){body:after{background-attachment:scroll}}
</style><link rel="stylesheet" href="radio-gali.css"></head><body><div id="world"><div class="cloud" style="top:12%;left:-30%"></div><div class="cloud"></div><div class="cloud"></div><div class="horizon"></div><div class="ground"></div><canvas id="weather"></canvas></div><main><header class="top"><a href="index.html" class="brand" style="text-decoration:none;color:inherit"><span class="mark">🌦️</span><span>RADIO GALI<div class="tiny">RITU • RADIO • SUKOON</div></span></a><div class="clock" id="clock">22:12</div></header><section class="hero"><div class="eyebrow" id="eyebrow">FOUR SEASONS · ONE WINDOW</div><h1 id="title">मॉनसून</h1><div class="subtitle" id="subtitle">BAARISH KI KHUSHBOO</div><div class="scene"><div class="sun" id="sun"></div><div class="moon" id="moon"></div><div class="landscape" id="land"></div><div class="hut" id="hut">🏡</div></div></section><nav class="season-picker" aria-label="Choose season"><button class="season" data-season="monsoon" aria-pressed="true">🌧️ Monsoon</button><button class="season" data-season="rain" aria-pressed="false">⛈️ Rainstorm</button><button class="season" data-season="summer" aria-pressed="false">☀️ Summer</button><button class="season" data-season="winter" aria-pressed="false">❄️ Winter</button><button class="season" data-season="autumn" aria-pressed="false">🍂 Autumn</button><button class="season" data-season="spring" aria-pressed="false">🌸 Spring</button></nav><section class="player"><div class="cover" id="cover">🌧️</div><div class="track"><b id="tracktitle">Mitti Ki Khushboo</b><small id="tracksub">Rain on tin roof · ambient loop</small></div><div class="controls"><button id="prev" aria-label="Previous season">‹</button><button class="play" id="play" aria-label="Play ambience">▶</button><button id="next" aria-label="Next season">›</button></div></section><div class="hint">CLICK A SEASON · WATCH THE SKY CHANGE · TAKE A BREATH</div></main><script>
const presets={monsoon:{title:'मॉनसून',sub:'BAARISH KI KHUSHBOO',sky:'#142f3d',ground:'#203c37',accent:'#a9e3ee',emoji:'🌧️',hut:'🏡',track:'Mitti Ki Khushboo',desc:'Rain on tin roof · ambient loop',weather:'rain',sun:false,moon:false},rain:{title:'बारिश की रात',sub:'THUNDER · WINDOW SEAT · CHAI',sky:'#111b31',ground:'#192a3c',accent:'#a4c9f0',emoji:'⛈️',hut:'🪟',track:'Khidki Pe Baarish',desc:'Rainfall, distant thunder & soft room tone',weather:'storm',sun:false,moon:true},summer:{title:'गर्मियों की दोपहर',sub:'AAM · DHOOP · SLOW AFTERNOON',sky:'#8e5934',ground:'#7b633b',accent:'#ffd06b',emoji:'☀️',hut:'🥭',track:'Aam Ke Ped Ke Neeche',desc:'Cicadas · warm wind · lazy afternoon',weather:'heat',sun:true,moon:false},winter:{title:'सर्दियों की रात',sub:'RAZAI · FOG · GARAM CHAI',sky:'#23364c',ground:'#34414b',accent:'#d4e7ff',emoji:'❄️',hut:'🧣',track:'Razai Wali Raat',desc:'Soft wind · distant birds · quiet winter',weather:'snow',sun:false,moon:true},autumn:{title:'पतझड़',sub:'DRY LEAVES · SOFT WIND',sky:'#57372e',ground:'#493d2d',accent:'#efb06a',emoji:'🍂',hut:'🍁',track:'Peepal Ke Patte',desc:'Leaves rustling in a quiet lane',weather:'leaves',sun:true,moon:false},spring:{title:'बसंत',sub:'PHOOL · PARINDE · NAYI SUBAH',sky:'#3c5b54',ground:'#3d6748',accent:'#f8c6d9',emoji:'🌸',hut:'🌷',track:'Subah Ka Bagh',desc:'Birdsong · breeze · garden ambience',weather:'petals',sun:true,moon:false}};
let current='monsoon',playing=false,ac=null,master=null,source=null,noiseBuffer=null,raf=0;
const $=id=>document.getElementById(id);
function setSeason(key){current=key;const p=presets[key];document.documentElement.style.setProperty('--sky',p.sky);document.documentElement.style.setProperty('--ground',p.ground);document.documentElement.style.setProperty('--glow',p.accent);document.body.style.background=p.sky;$('title').textContent=p.title;$('subtitle').textContent=p.sub;$('eyebrow').textContent='RADIO GALI · '+key.toUpperCase()+' SEASON';$('cover').textContent=p.emoji;$('hut').textContent=p.hut;$('tracktitle').textContent=p.track;$('tracksub').textContent=p.desc;$('sun').style.display=p.sun?'block':'none';$('moon').style.display=p.moon?'block':'none';document.querySelectorAll('.season').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.season===key)));seedWeather(p.weather);if(playing)startSound(true)}
document.querySelectorAll('.season').forEach(b=>b.addEventListener('click',()=>setSeason(b.dataset.season)));$('prev').onclick=()=>cycle(-1);$('next').onclick=()=>cycle(1);function cycle(n){const a=Object.keys(presets);setSeason(a[(a.indexOf(current)+n+a.length)%a.length])}
function seedWeather(type){const w=$('world');w.querySelectorAll('.particle').forEach(e=>e.remove());if(type==='heat'){for(let i=0;i<5;i++){let e=document.createElement('i');e.className='heat particle';e.style.left=(i*20)+'%';w.appendChild(e)}return}const n=type==='storm'?120:type==='rain'?90:55;for(let i=0;i<n;i++){let e=document.createElement('i');e.className='particle '+(type==='rain'||type==='storm'?'rain-drop':type==='snow'?'snow':type==='leaves'?'leaf':'snow');e.style.left=Math.random()*100+'%';e.style.animationDuration=(type==='storm'?'.45':type==='rain'?'.8':type==='snow'?4+Math.random()*8:7+Math.random()*8)+'s';e.style.animationDelay=(-Math.random()*12)+'s';if(type==='leaves')e.textContent='🍂';if(type==='petals')e.textContent='🌸';w.appendChild(e)}}
function initAudio(){if(ac)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();master=ac.createGain();master.gain.value=.11;master.connect(ac.destination);noiseBuffer=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);let d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
function startSound(restart=false){initAudio();if(!ac)return;if(ac.state==='suspended')ac.resume();if(source){try{source.stop()}catch{}source=null}if(!playing&&!restart){playing=true;$('play').textContent='Ⅱ'}const p=presets[current];if(p.weather==='rain'||p.weather==='storm'){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuffer;s.loop=true;f.type='lowpass';f.frequency.value=p.weather==='storm'?900:2400;g.gain.value=p.weather==='storm'?.28:.16;s.connect(f).connect(g).connect(master);s.start();source=s;if(p.weather==='storm')thunder()}else if(p.weather==='heat'){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=80;g.gain.value=.012;o.connect(g).connect(master);o.start();source=o}else{const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuffer;s.loop=true;f.type='lowpass';f.frequency.value=p.weather==='snow'?500:1200;g.gain.value=.035;s.connect(f).connect(g).connect(master);s.start();source=s}}
function thunder(){if(!ac||!playing||current!=='rain')return;const delay=5+Math.random()*9;setTimeout(()=>{if(!playing||current!=='rain')return;const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(75,ac.currentTime);o.frequency.exponentialRampToValueAtTime(28,ac.currentTime+2);g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.linearRampToValueAtTime(.13,ac.currentTime+.3);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+3);o.connect(g).connect(master);o.start();o.stop(ac.currentTime+3);thunder()},delay*1000)}
$('play').onclick=()=>{if(playing){playing=false;$('play').textContent='▶';if(source){try{source.stop()}catch{}source=null}}else startSound()};
function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});requestAnimationFrame(tick)}tick();setSeason('monsoon');
</script><script src="radio-gali-motion.js" defer></script></body></html>
